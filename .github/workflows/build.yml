name: build

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/gbt_studyapp.jks

      - name: Write Android signing config
        run: |
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"      # strip optional v prefix -> 1.2.3 or 1.2.3-beta2
          BASE="${TAG%%-*}"               # part before -   -> 1.2.3
          SUFFIX="${TAG#*-}"              # part after -    -> beta2, or unchanged if no -
          IFS=. read MAJOR MINOR PATCH <<< "$BASE"

          PRTYPE=0
          PRNUM=0
          IS_PRERELEASE=false
          if [ "$SUFFIX" != "$TAG" ]; then
            IS_PRERELEASE=true
            TYPE_STR="$(printf '%s' "$SUFFIX" | sed 's/[0-9].*$//')"   # alpha|beta|rc
            PRNUM="$(printf '%s' "$SUFFIX" | sed 's/^[^0-9]*//')"       # 1, 2, ...
            PRNUM="${PRNUM:-0}"
            case "$TYPE_STR" in
              alpha) PRTYPE=1 ;;
              beta)  PRTYPE=2 ;;
              rc)    PRTYPE=3 ;;
              *)     PRTYPE=9 ;;
            esac
          fi

          BUILD=$(( MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + PRTYPE * 100 + PRNUM ))
          echo "build-name=$TAG"        >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD"    >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.version.outputs.build-name }} --build-number=${{ steps.version.outputs.build-number }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.build-name }} --build-number=${{ steps.version.outputs.build-number }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.is-prerelease }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
