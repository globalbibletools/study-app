name: build

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/45165992121/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: fastlane@global-bible-too-1694742039480.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode Android release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/gbt_studyapp.jks

      - name: Write Android signing config
        run: |
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"      # strip optional v prefix -> 1.2.3 or 1.2.3-beta2
          BASE="${TAG%%-*}"               # part before -   -> 1.2.3
          SUFFIX="${TAG#*-}"              # part after -    -> beta2, or unchanged if no -

          IS_PRERELEASE=false
          if [ "$SUFFIX" != "$TAG" ]; then
            IS_PRERELEASE=true
          fi

          BUILD=$(( GITHUB_RUN_NUMBER + 50 ))

          echo "build-name=$TAG"        >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD"    >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build arm64 APK
        run: flutter build apk --no-pub --release --split-per-abi --target-platform android-arm64 --build-name=${{ steps.version.outputs.build-name }} --build-number=${{ steps.version.outputs.build-number }}

      - name: Build App Bundle
        run: flutter build appbundle --no-pub --release --build-name=${{ steps.version.outputs.build-name }} --build-number=${{ steps.version.outputs.build-number }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.is-prerelease }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        working-directory: android
        run: bundle install --jobs 4 --retry 3

      - name: Upload to Play Store internal track
        working-directory: android
        run: bundle exec fastlane android internal

      - name: Upload to Play Store production track
        if: steps.version.outputs.is-prerelease == 'false'
        working-directory: android
        run: bundle exec fastlane android production
